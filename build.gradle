plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = providers.gradleProperty('version').orElse('0.0.0-SNAPSHOT').get()

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

application {
    mainClass = 'com.example.datapipe.Main'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    archiveBaseName = 'producer-consumer-service'
    manifest {
        attributes(
            'Main-Class': application.mainClass.get(),
            'Implementation-Version': project.version
        )
    }
}

tasks.named('run') {
    standardInput = System.in
}

tasks.named('javadoc', Javadoc) {
    options.encoding = 'UTF-8'
    options.docTitle = "producer-consumer-service ${project.version} API"
    options.windowTitle = "producer-consumer-service ${project.version} API"
}

tasks.register('javadocJar', Jar) {
    dependsOn tasks.javadoc
    archiveBaseName = 'producer-consumer-service'
    archiveClassifier = 'javadoc'
    from tasks.javadoc.destinationDir
}

tasks.named('assemble') {
    dependsOn tasks.javadocJar
}

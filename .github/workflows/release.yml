name: Release from main

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Version, build, test, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Calculate next patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
          if [[ -z "$latest" ]]; then
            version="1.0.0"
          else
            current="${latest#v}"
            IFS='.' read -r major minor patch <<< "$current"
            version="${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: ./gradlew clean test jar javadocJar -Pversion=${{ steps.version.outputs.version }}
      - name: Generate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          for jar_file in build/libs/*.jar; do
            sha256sum "$jar_file" > "${jar_file}.sha256"
            cat "${jar_file}.sha256"
          done
      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.version }}" "${GITHUB_SHA}"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
            build/libs/*.jar.sha256

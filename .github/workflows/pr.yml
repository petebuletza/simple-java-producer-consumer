name: PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v5
      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew clean test jar -Pversion=0.0.0-pr.${{ github.event.pull_request.number }}.${{ github.sha }}
      - name: Upload PR binary
        uses: actions/upload-artifact@v4
        with:
          name: producer-consumer-service-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/
          if-no-files-found: error
          retention-days: 30
